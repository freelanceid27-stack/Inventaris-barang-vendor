<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Barang Bawaan Vendor/Proyek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        primary: '#FFCC00', 
                        primaryDark: '#E6B800', 
                        secondary: '#1A1A1A', 
                        neutral: '#86909C', 
                        light: '#F2F3F5', 
                        dark: '#121212',
                        darkBg: '#0F1115', 
                        darkCard: '#1C1F26' 
                    },
                    fontFamily: { inter: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        /* CSS SLIDER DENGAN KOTAK PUTIH */
        .slider-frame {
            width: 160px;
            height: 160px;
            background: white;
            border-radius: 2.5rem;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            align-items: center;
            margin: 0 auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #f3f4f6;
        }

        .dark .slider-frame {
            background: #ffffff;
            border: 2px solid #333;
        }

        .slider-frame::-webkit-scrollbar { display: none; }
        .slider-track { display: flex; width: auto; }

        .slide-item {
            width: 160px;
            height: 160px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            padding: 20px;
        }

        .slide-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
        }

        /* FITUR LAIN TETAP TERJAGA */
        .text-shadow { text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .card-shadow { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); }
        .hover-scale { transition: all 0.2s ease; }
        .hover-scale:hover { transform: scale(1.02); }
        .btn-touch { transition: all 0.2s ease; }
        .btn-touch:active { transform: scale(0.98); }
        .heading-responsive { font-size: clamp(1.5rem, 4vw, 2.5rem); }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 dark:from-darkBg dark:to-dark dark:text-gray-100 font-inter text-dark min-h-screen flex flex-col transition-colors duration-300">

    <div class="fixed top-5 right-5 z-50">
        <button onclick="toggleDarkMode()" class="bg-white dark:bg-darkCard p-3 rounded-full shadow-lg border border-gray-200 dark:border-gray-700 hover-scale btn-touch text-secondary dark:text-primary">
            <i id="darkIcon" class="fa-solid fa-moon text-xl"></i>
        </button>
    </div>

    <main class="flex-1 flex flex-col items-center justify-center p-5 py-8">
        
        <!-- Logo Slider -->
        <div class="mb-6">
            <div class="slider-frame">
                <div class="slider-track">
                    <div class="slide-item">
                        <img src="logo-utpe1.png" alt="UTPE">
                    </div>
                    <div class="slide-item">
                        <img src="logo-patria.png" alt="PATRIA">
                    </div>
                    <div class="slide-item">
                        <img src="logo-dpp.png" alt="DPP">
                    </div>
                </div>
            </div>
            <!-- TEKS SUDAH DIUBAH JADI TEGAK & RINGKAS -->
            <p class="text-[10px] text-neutral text-center mt-2 opacity-60 font-medium">Geser Logo</p>
        </div>

        <h1 class="heading-responsive font-extrabold text-center text-dark dark:text-white mb-2 text-shadow leading-tight">
            Registrasi Barang Bawaan <br class="hidden sm:block"> Vendor/Proyek
        </h1>
        
        <p class="text-neutral dark:text-gray-400 text-center text-sm sm:text-base mb-10 max-w-xs sm:max-w-md font-medium leading-relaxed px-4">
            Sistem Inventarisasi Mandiri PT. United Tractors <span class="text-primary font-bold">Pandu Engineering</span>
        </p>

        <div class="bg-white dark:bg-darkCard rounded-3xl p-6 sm:p-8 w-full max-w-md card-shadow border border-gray-100 dark:border-gray-800 mb-8 transition-colors duration-300">
            <h2 class="text-center text-lg sm:text-xl font-bold mb-6 text-dark dark:text-white">
                Menu Utama
            </h2>

            <div class="space-y-4">
                <a href="form-vendor.html" class="block">
                    <button class="w-full bg-primary hover:bg-primaryDark active:bg-primaryDark text-secondary p-4 sm:p-5 rounded-2xl font-bold text-base sm:text-lg flex items-center justify-between shadow-md hover:shadow-lg btn-touch hover-scale">
                        <div class="flex items-center gap-3">
                            <span class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-black/10 flex items-center justify-center text-secondary">
                                <i class="fa-solid fa-plus text-sm sm:text-base"></i>
                            </span>
                            <span>Cek In Barang</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-secondary/50 text-sm"></i>
                    </button>
                </a>

                <a href="form-checkout.html" class="block">
                    <button class="w-full bg-secondary hover:bg-black active:bg-black text-white p-4 sm:p-5 rounded-2xl font-bold text-base sm:text-lg flex items-center justify-between shadow-md hover:shadow-lg btn-touch hover-scale">
                        <div class="flex items-center gap-3">
                            <span class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-white/20 flex items-center justify-center text-white">
                                <i class="fa-solid fa-minus text-sm sm:text-base"></i>
                            </span>
                            <span>Cek Out Barang</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-white/50 text-sm"></i>
                    </button>
                </a>
            </div>
        </div>

        <div class="bg-white dark:bg-darkCard rounded-2xl p-3 w-full max-w-md text-center text-xs sm:text-sm text-neutral dark:text-gray-400 shadow-sm border border-gray-100 dark:border-gray-800 transition-colors duration-300">
            <p class="font-medium">Sistem Berbasis Web v1.0 | Aman & Terintegrasi</p>
        </div>
    </main>

    <footer class="py-4 text-center text-neutral dark:text-gray-500 text-[10px] sm:text-xs">
        <p>&copy; 2026 PT. United Tractors <span class="text-primary dark:text-primary font-semibold">Pandu Engineering</span>. Semua Hak Dilindungi.</p>
    </footer>

    <script>
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('darkIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('theme', 'dark');
            }
        }
        window.addEventListener('DOMContentLoaded', () => {
            const icon = document.getElementById('darkIcon');
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                if(icon) icon.classList.replace('fa-moon', 'fa-sun');
            }
        });
    </script>
</body>
</html>
